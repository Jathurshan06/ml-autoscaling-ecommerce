version: "3.9"

services:

  database:
    image: postgres:15

    container_name: vjtech-database

    restart: always

    environment:
      POSTGRES_DB: vjtech_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123

    ports:
      - "5432:5432"

    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/2-sample_data.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vjtech_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build: ./backend

    container_name: vjtech-backend

    restart: always

    ports:
      - "3000:3000"

    depends_on:
      database:
        condition: service_healthy

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: database


  frontend:
    build: ./frontend

    container_name: vjtech-frontend

    restart: always

    ports:
      - "8080:80"

    depends_on:
      - backend
